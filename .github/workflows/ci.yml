name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
